# Intégration continue : tests de l'API (SQLite + PostgreSQL), tests et build du front,
# puis parcours de bout en bout sur la plateforme complète lancée par Docker Compose.
name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: expernet_test
          POSTGRES_USER: expernet
          POSTGRES_PASSWORD: ci-only
        ports: ["5432:5432"]
        options: --health-cmd pg_isready --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, pdo_sqlite, gd, intl
      - run: composer install --no-interaction --prefer-dist
      - run: cp .env.example .env && php artisan key:generate
      - name: Tests (SQLite)
        run: vendor/bin/phpunit
      - name: Tests (PostgreSQL)
        run: vendor/bin/phpunit
        env:
          DB_CONNECTION: pgsql
          DB_HOST: 127.0.0.1
          DB_DATABASE: expernet_test
          DB_USERNAME: expernet
          DB_PASSWORD: ci-only

  front:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Tests unitaires et de composants (Vitest)
        run: |
          if [ -f node_modules/.bin/vitest ]; then npm run test:unit; else echo "Vitest n'est pas encore installé (voir docs/08) : étape ignorée."; fi
      - run: npm run build

  e2e:
    runs-on: ubuntu-latest
    needs: [api, front]
    steps:
      - uses: actions/checkout@v4
      - name: Configuration de démonstration
        run: |
          cp .env.example .env
          sed -i 's/^DB_PASSWORD=.*/DB_PASSWORD=ci-e2e-only/; s/^DEMO_PASSWORD=.*/DEMO_PASSWORD=Demo-E2e-2026/' .env
      - name: Démarrage de la plateforme
        run: docker compose up -d --build
      - name: Attente de la plateforme (API et front)
        run: |
          for i in $(seq 1 120); do
            if curl -fsS -o /dev/null http://localhost:8080/api/sante && curl -fsS -o /dev/null http://localhost:8080/; then exit 0; fi
            sleep 5
          done
          docker compose logs --tail 80 backend frontend nginx
          exit 1
      - name: Parcours de bout en bout (Playwright)
        run: docker compose --profile tests run --rm -e CI=1 e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: rapport-playwright
          path: frontend/e2e/playwright-report
          retention-days: 7
