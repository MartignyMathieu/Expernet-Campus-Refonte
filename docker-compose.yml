# Plateforme unifiée Expernet — environnement de développement complet.
# Lancement : docker compose up -d --build   →   http://localhost:8080
name: expernet

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_DATABASE:-expernet}
      POSTGRES_USER: ${DB_USERNAME:-expernet}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Définissez DB_PASSWORD dans .env}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build: ./docker/php
    working_dir: /var/www/backend
    env_file: .env
    environment:
      DB_CONNECTION: pgsql
      DB_HOST: db
      DB_PORT: 5432
    volumes:
      - ./backend:/var/www/backend
      # Dépendances PHP dans un volume Docker (rapide) plutôt que dans le dossier partagé avec Windows
      - backend-vendor:/var/www/backend/vendor
      - ./docker/php/expernet.ini:/usr/local/etc/php/conf.d/zz-expernet.ini:ro
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: node:22-alpine
    working_dir: /app
    # Réinstalle et recompile seulement si nécessaire, puis sert le build depuis un volume rapide
    command: sh /usr/local/bin/demarrer-front.sh
    environment:
      NUXT_API_INTERNAL: http://nginx
      NUXT_PUBLIC_SITE_URL: ${APP_URL:-http://localhost:8080}
      PORT: 3000
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
      - frontend-build:/srv/front
      - ./docker/node/demarrer.sh:/usr/local/bin/demarrer-front.sh:ro

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./backend/public:/var/www/backend/public:ro   # seul le dossier public de Laravel est exposé
    depends_on:
      - backend
      - frontend

  mailpit:
    image: axllent/mailpit:v1.20
    ports:
      - "8025:8025"

volumes:
  db-data:
  backend-vendor:
  frontend-node-modules:
  frontend-build:
