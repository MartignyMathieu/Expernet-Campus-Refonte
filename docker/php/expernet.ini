; Performances PHP sous Docker Desktop (Windows) : le code est lu à travers un partage de dossier lent.
; OPcache garde le code compilé en mémoire ; le cache realpath évite de re-résoudre les chemins à chaque requête.
opcache.enable=1
opcache.memory_consumption=192
opcache.interned_strings_buffer=16
opcache.max_accelerated_files=20000
; Développement : les modifications restent prises en compte (vérification toutes les 2 secondes)
opcache.validate_timestamps=1
opcache.revalidate_freq=2
realpath_cache_size=4096K
realpath_cache_ttl=600
