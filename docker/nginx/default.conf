# Point d'entrée unique : même origine pour le front et l'API (cookies de session + CSRF sans CORS).
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Compression des réponses texte (HTML, CSS, JS, JSON) : pages plus légères
    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /var/www/backend/public;

    # DNS interne de Docker, interrogé à chaque requête (cache 10 s) : quand un conteneur redémarre
    # et change d'adresse IP, nginx la retrouve tout seul (sinon 502 jusqu'au redémarrage de nginx).
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api backend:9000;
    set $front http://frontend:3000;

    # API Laravel (et Swagger UI / OpenAPI)
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files /index.php =404;
        fastcgi_pass $api;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_read_timeout 180s;
    }
    location = /openapi.json { try_files $uri =404; }

    # Tout le reste : application Nuxt (SSR)
    location / {
        proxy_pass $front;
        # Premier affichage après un démarrage : sous Windows, le front peut mettre 2 à 3 minutes
        # (fichiers lus à travers le partage de dossier Docker). On patiente au lieu d'afficher une erreur.
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
