# Point d'entrée unique : même origine pour le front et l'API (cookies de session + CSRF sans CORS).
server {
    listen 80;
    server_name _;
    client_max_body_size 12m;
    server_tokens off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    root /var/www/backend/public;

    # API Laravel (et Swagger UI / OpenAPI)
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files /index.php =404;
        fastcgi_pass backend:9000;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
    }
    location = /openapi.json { try_files $uri =404; }

    # Tout le reste : application Nuxt (SSR)
    location / {
        proxy_pass http://frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
