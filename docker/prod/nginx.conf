# Production : HTTPS obligatoire (redirection depuis HTTP), en-têtes de sécurité, compression.
# Certificats attendus dans docker/prod/certs/ (fullchain.pem, privkey.pem) : voir docs/08-mise-en-production.md.

server {
    listen 80;
    server_name _;
    server_tokens off;

    # Renouvellement Let's Encrypt (méthode webroot) et sonde de santé interne
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location = /sante-interne { access_log off; return 200 "ok\n"; }

    location / { return 301 https://$host$request_uri; }
}

# Accès interne (réseau Docker uniquement, port non publié) : appels de l'API par le rendu serveur de Nuxt.
server {
    listen 8081;
    server_name _;
    server_tokens off;
    root /var/www/backend/public;
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api backend:9000;
    location ~ ^/(api|sanctum|up)(/|$) {
        try_files /index.php =404;
        fastcgi_pass $api;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
    }
    location / { return 404; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;
    server_tokens off;
    client_max_body_size 12m;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    root /var/www/backend/public;

    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api backend:9000;
    set $front http://frontend:3000;

    location ~ ^/(api|sanctum|up)(/|$) {
        try_files /index.php =404;
        fastcgi_pass $api;
        fastcgi_param SCRIPT_FILENAME /var/www/backend/public/index.php;
        include fastcgi_params;
        fastcgi_param HTTP_PROXY "";
        fastcgi_param HTTPS on;
        fastcgi_read_timeout 60s;
    }
    location = /openapi.json { try_files $uri =404; }

    location / {
        proxy_pass $front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }
}
